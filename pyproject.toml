[project]
name = "customer-support-agent"
version = "0.1.0"
description = "AI Customer Support & Knowledge Agent - Version 1"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "chromadb>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
csa = "customer_support_agent.main:main"
csa-server = "customer_support_agent.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.vercel]
entrypoint = "backend.customer_support_agent.server:app"
